spring:
  application:
    name: mcp-tool-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mcp_gateway}
    username: ${DB_USER:mcp}
    password: ${DB_PASSWORD:mcp}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: mcp-tool-gateway
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: 8080

# vredis HTTP Adapter 地址（阶段五；超时可调 connect-timeout-ms / request-timeout-ms）
vredis:
  base-url: ${VREDIS_BASE_URL:}

# 熔断/超时参数在 gateway.upstreams.resilience（Resilience4j core 由 UpstreamConfig 装配）

management:
  # compose 部署设 MANAGEMENT_SERVER_PORT=9091 把指标端点移到内网端口（宿主机不暴露）；
  # 本地裸跑不设该变量时与业务共享 8080，开箱行为不变
  server:
    port: ${MANAGEMENT_SERVER_PORT:8080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: mcp-tool-gateway
    distribution:
      percentiles-histogram:
        mcp.tool.duration: true
        # pending 等待时长也要 histogram：Grafana 面板的 P50/P95 依赖 _bucket 序列
        mcp.tool.pending.duration: true
        mcp.upstream.duration: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 开发/测试用内存 API Key（生产实现需改为数据库存储 + 密钥哈希）
# 工具联邦的熔断/超时设置（Resilience4j core 模块由 UpstreamConfig 装配，
# 因 resilience4j-spring-boot3 官方不支持 Boot 4，故不走其 YAML 约定）
gateway:
  # 种子 API Key 开关：默认开启供本地开发/测试；暴露在不可信网络的部署必须置 false
  seed-api-keys: ${GATEWAY_SEED_API_KEYS:true}
  # 工具联邦：远程 upstream MCP Server（阶段六）
  upstreams:
    health-check-fixed-delay-ms: ${GATEWAY_UPSTREAMS_HEALTH_CHECK_MS:30000}
    # 注意层级：UpstreamProperties(prefix=gateway.upstreams) 的 resilience 分组，
    # 配错层级会被静默忽略并回落到 record 里的默认值
    resilience:
      circuitbreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state-seconds: 30
        permitted-number-of-calls-in-half-open-state: 3
      timelimiter:
        timeout-duration-seconds: 5
    upstreams:
      - name: time
        base-url: ${GATEWAY_UPSTREAMS_TIME_URL:http://localhost:8090/mcp}
        api-key: ""
        enabled: true
      - name: weather
        base-url: ${GATEWAY_UPSTREAMS_WEATHER_URL:http://localhost:8091/mcp}
        api-key: ""
        enabled: true

logging:
  level:
    com.example.mcp: DEBUG
    io.modelcontextprotocol: INFO
