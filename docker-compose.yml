# mcp-tool-gateway 完整部署：PostgreSQL 16 + 网关本体 + 联邦 upstream + 可观测性
# 用法:
#   ./mvnw package -DskipTests                        # 打出全部 fat jar（gateway + 两个 upstream）
#   docker compose up -d
# 宿主机端口如与已有服务冲突（如 5432/8080/3000/9090），在 .env 里覆盖对应 HOST_PORT 即可。
services:
  postgres:
    image: postgres:16
    container_name: mcp-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: ${DB_USER:-mcp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcp}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    container_name: mcp-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mcp_gateway
      DB_USER: ${DB_USER:-mcp}
      DB_PASSWORD: ${DB_PASSWORD:-mcp}
      # 未部署 vredis 时留空即可：工具调用会返回结构化的 vredis_unavailable JSON
      VREDIS_BASE_URL: ${VREDIS_BASE_URL:-}
      # 种子 API Key 开关：本地演示保持 true；暴露在不可信网络的部署必须置 false
      GATEWAY_SEED_API_KEYS: ${GATEWAY_SEED_API_KEYS:-true}
      # 指标端点移到内网管理端口（宿主机映射只有业务 8080）
      MANAGEMENT_SERVER_PORT: 9091
      # 限流后端：redis 启用跨实例全局精确配额
      GATEWAY_RATE_LIMITER: redis
      SPRING_DATA_REDIS_HOST: redis
      # 工具联邦：upstream MCP Server 地址
      GATEWAY_UPSTREAMS_TIME_URL: http://upstream-time:8090/mcp
      GATEWAY_UPSTREAMS_WEATHER_URL: http://upstream-weather:8091/mcp
      # 容器内存感知：默认 JVM 只敢用 25%，这里放开到 75%（配合下方 mem_limit 生效）
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      upstream-time:
        condition: service_healthy
      upstream-weather:
        condition: service_healthy

  # 多实例验证（已实测）：双实例并发打同一条 CONFIRMED 确认单——gw1=executed、gw2=pending，
  # 原子 claim 与 ShedLock 跨实例正确性成立。需要时取消注释即可再次验证。
  # 注意：多实例下限流必须用 Redis 后端（两实例都配 GATEWAY_RATE_LIMITER=redis +
  # SPRING_DATA_REDIS_HOST=redis，与主 gateway 一致），否则限流按实例独立计数而失真。
  # gateway-2:
  #   build: .
  #   container_name: mcp-gateway-2
  #   ...（其余 environment/depends_on 复制主 gateway 并加上面两行 Redis 配置）

  # 联邦演示 upstream：时间 MCP Server
  upstream-time:
    build:
      context: .
      dockerfile: examples/upstream-time/Dockerfile
    container_name: mcp-upstream-time
    restart: unless-stopped
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 4s
      start_period: 90s
      retries: 5
    ports:
      - "127.0.0.1:${UPSTREAM_TIME_HOST_PORT:-8090}:8090"

  # 联邦演示 upstream：天气 MCP Server（假数据）
  upstream-weather:
    build:
      context: .
      dockerfile: examples/upstream-weather/Dockerfile
    container_name: mcp-upstream-weather
    restart: unless-stopped
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/actuator/health || exit 1"]
      interval: 20s
      timeout: 4s
      start_period: 90s
      retries: 5
    ports:
      - "127.0.0.1:${UPSTREAM_WEATHER_HOST_PORT:-8091}:8091"

  # 限流后端：多实例部署时的全局计数器
  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]

  # 可观测性：Prometheus 抓取 gateway 指标
  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  # 可观测性：Grafana 面板（默认 admin/admin，可用 GRAFANA_ADMIN_PASSWORD 覆盖；已自动装配数据源与 dashboard）
  grafana:
    image: grafana/grafana:latest
    container_name: mcp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
