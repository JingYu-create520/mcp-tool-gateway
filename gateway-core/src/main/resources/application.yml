spring:
  application:
    name: mcp-tool-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mcp_gateway}
    username: ${DB_USER:mcp}
    password: ${DB_PASSWORD:mcp}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: mcp-tool-gateway
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: 8080

# vredis HTTP Adapter 地址（阶段五）
vredis:
  base-url: ${VREDIS_BASE_URL:http://localhost:9090}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 开发/测试用内存 API Key（生产实现需改为数据库存储 + 密钥哈希）
# 工具联邦的熔断/超时设置（Resilience4j core 模块由 UpstreamConfig 装配，
# 因 resilience4j-spring-boot3 官方不支持 Boot 4，故不走其 YAML 约定）
gateway:
  api-keys:
    keys:
      admin-key:
        callerId: admin-user
        tenantId: tenant-a
        roles:
          - admin
          - user
      user-key:
        callerId: user-1
        tenantId: tenant-a
        roles:
          - user
  # 工具联邦：远程 upstream MCP Server（阶段六）
  upstreams:
    health-check-fixed-delay-ms: ${GATEWAY_UPSTREAMS_HEALTH_CHECK_MS:30000}
    circuitbreaker:
      sliding-window-size: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state-seconds: 30
      permitted-number-of-calls-in-half-open-state: 3
    timelimiter:
      timeout-duration-seconds: 5
    upstreams:
      - name: time
        base-url: ${GATEWAY_UPSTREAMS_TIME_URL:http://localhost:8090/mcp}
        api-key: ""
        enabled: true
      - name: weather
        base-url: ${GATEWAY_UPSTREAMS_WEATHER_URL:http://localhost:8091/mcp}
        api-key: ""
        enabled: true

logging:
  level:
    com.example.mcp: DEBUG
    io.modelcontextprotocol: INFO
